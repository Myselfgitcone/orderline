[project]
name = "orderline"
version = "0.1.0"
description = "CDC from a live order database into Databricks, with a late-delivery model."
readme = "README.md"
authors = [{ name = "Jagadish Butukuri", email = "jagadishbutukuri11@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "starlette>=0.40",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.scripts]
orderline = "orderline.cli:app"

[dependency-groups]
dev = [
    "httpx2>=0.1",  # starlette's TestClient
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orderline"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["SIM905"]  # word lists read better as one split string

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: needs ORDERLINE_TEST_DSN pointing at a scratch Postgres"]
