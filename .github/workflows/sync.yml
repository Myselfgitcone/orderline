name: sync

# Every 6 hours: run the shop forward to now, then drain the replication slot
# through Debezium into the Databricks volume.
on:
  schedule:
    - cron: "20 */6 * * *"
  workflow_dispatch:

# Two syncs must never share the slot.
concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    outputs:
      refreshed: ${{ steps.record.outputs.refreshed }}
    env:
      ORDERLINE_DATABASE_URL: ${{ secrets.ORDERLINE_DATABASE_URL }}
      ORDERLINE_DATABRICKS_HOST: ${{ secrets.ORDERLINE_DATABRICKS_HOST }}
      ORDERLINE_DATABRICKS_TOKEN: ${{ secrets.ORDERLINE_DATABRICKS_TOKEN }}
    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$ORDERLINE_DATABASE_URL" ] || [ -z "$ORDERLINE_DATABRICKS_TOKEN" ]; then
            echo "::warning title=Not configured::Set ORDERLINE_DATABASE_URL, ORDERLINE_DATABRICKS_HOST and ORDERLINE_DATABRICKS_TOKEN."
            echo "ready=0" >> "$GITHUB_OUTPUT"
          else
            echo "ready=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == '1'
      - uses: astral-sh/setup-uv@v6
        if: steps.secrets.outputs.ready == '1'
        with:
          python-version: "3.12"
      - if: steps.secrets.outputs.ready == '1'
        run: |
          uv sync --frozen
          uv run orderline setup
          uv run orderline tick
          uv run orderline sync

      # Then rebuild silver and gold from the new batch.
      - uses: databricks/setup-cli@main
        if: steps.secrets.outputs.ready == '1'
      - name: Refresh the pipeline
        id: refresh
        if: steps.secrets.outputs.ready == '1'
        continue-on-error: true
        working-directory: databricks
        env:
          DATABRICKS_HOST: https://${{ secrets.ORDERLINE_DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.ORDERLINE_DATABRICKS_TOKEN }}
        run: |
          set -o pipefail
          if databricks bundle run refresh 2>&1 | tee "$RUNNER_TEMP/refresh.log"; then
            exit 0
          fi
          # Free Edition has refused to start *jobs* through the API since late
          # October ("Triggering new runs ... is currently disabled"). Pipelines
          # are a different endpoint. Start the pipeline update directly and wait
          # for it; the gold tables refresh, the page can publish. The job's second
          # task (scoring open orders with the champion model) does not run on
          # this path, so the risk list on the page stays as of the last full run.
          if ! grep -q "Triggering new runs" "$RUNNER_TEMP/refresh.log"; then
            exit 1
          fi
          echo "Jobs API refused; starting the pipeline update directly." | tee -a "$RUNNER_TEMP/refresh.log"
          id=$(databricks pipelines list-pipelines --filter "name LIKE 'orderline'" -o json | python3 -c 'import json,sys; p=[x for x in json.load(sys.stdin) if x["name"]=="orderline"]; print(p[0]["pipeline_id"] if p else "")')
          [ -n "$id" ] || { echo "no pipeline named orderline" | tee -a "$RUNNER_TEMP/refresh.log"; exit 1; }
          update=$(databricks pipelines start-update "$id" -o json 2>&1 | tee -a "$RUNNER_TEMP/refresh.log" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("update_id",""))' 2>/dev/null)
          [ -n "$update" ] || exit 1
          for i in $(seq 1 60); do
            state=$(databricks pipelines get-update "$id" "$update" -o json | python3 -c 'import json,sys; print(json.load(sys.stdin)["update"]["state"])')
            echo "pipeline update $update: $state"
            case "$state" in
              COMPLETED) echo "pipeline refreshed directly (scoring task skipped)" | tee -a "$RUNNER_TEMP/refresh.log"; exit 0 ;;
              FAILED|CANCELED) echo "pipeline update ended $state" | tee -a "$RUNNER_TEMP/refresh.log"; exit 1 ;;
            esac
            sleep 20
          done
          echo "pipeline update still running after 20 minutes" | tee -a "$RUNNER_TEMP/refresh.log"; exit 1

      # Databricks Free Edition sometimes disables job triggers for a while
      # ("Triggering new runs for organization ... is currently disabled").
      # The capture above has already landed in the volume, so a failed refresh
      # is not worth a red run and an email four times a day. Instead: a warning
      # on the run, one open issue as the record (reused, never duplicated), and
      # no page rebuild, since the gold tables did not change. The issue closes
      # itself on the next refresh that works.
      - name: Record the refresh result
        id: record
        if: steps.secrets.outputs.ready == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OUTCOME: ${{ steps.refresh.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Databricks pipeline refresh is failing"
          open=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ "$OUTCOME" = "success" ]; then
            if [ -n "$open" ]; then
              gh issue close "$open" --comment "The refresh succeeded again in $RUN_URL. Closing."
            fi
            echo "refreshed=1" >> "$GITHUB_OUTPUT"
          else
            tail="$(tail -n 5 "$RUNNER_TEMP/refresh.log" 2>/dev/null || echo "(no log)")"
            echo "::warning title=Pipeline not refreshed::The capture landed, but 'databricks bundle run refresh' failed, so the page was not republished. See the open issue."
            if [ -z "$open" ]; then
              gh issue create --title "$title" --body "$(printf '%s\n\n%s\n\n```\n%s\n```\n\n%s' \
                "The sync captured changes and uploaded them, but the Lakeflow refresh job could not start. The public page keeps its last good numbers until this clears." \
                "First seen in $RUN_URL. Later runs with the same failure add nothing here; this issue closes itself when a refresh succeeds." \
                "$tail" \
                "If the message is about triggering being disabled for the organization, that is a Databricks-side restriction on the Free Edition workspace: log in, check the banner, and try running the orderline-refresh job by hand.")"
            fi
            echo "refreshed=0" >> "$GITHUB_OUTPUT"
          fi

  # Republish the public page with the new numbers. Skipped when the pipeline
  # did not refresh: the numbers would be the same as last time.
  site:
    needs: sync
    if: needs.sync.outputs.refreshed == '1'
    uses: ./.github/workflows/site.yml
    secrets: inherit
    permissions:
      contents: read
      pages: write
      id-token: write
