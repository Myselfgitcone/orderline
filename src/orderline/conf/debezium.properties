# Debezium Server: Postgres in, HTTP out. Connection details, the slot and the
# publication come from DEBEZIUM_SOURCE_* environment variables (see debezium.py).

debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.topic.prefix=orderline
debezium.source.plugin.name=pgoutput
debezium.source.publication.autocreate.mode=disabled
# The slot predates the data, so streaming alone sees every row. No snapshot.
debezium.source.snapshot.mode=no_data
debezium.source.schema.include.list=shop
debezium.source.tombstones.on.delete=false
# The sync job writes a marker with pg_logical_emit_message; seeing it come
# through means everything committed before it has arrived.
debezium.source.message.prefix.include.list=orderline

# Offsets are only committed when the container stops gracefully, and that's
# when the LSN is confirmed to the slot. The sync stops gracefully only after
# the batch is safely in Databricks; on any failure it kills the container
# instead, and the slot hands the same changes over again next time.
debezium.source.offset.storage.file.filename=/tmp/offsets.dat
debezium.source.offset.flush.interval.ms=86400000

debezium.sink.type=http
debezium.sink.http.batch.enabled=true
debezium.sink.http.batch.max-size=500
debezium.sink.http.timeout.ms=60000

debezium.format.value=json
debezium.format.value.schemas.enable=false
debezium.format.key=json
debezium.format.key.schemas.enable=false

quarkus.log.console.json=false
quarkus.log.level=INFO
